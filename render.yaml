# Render Blueprint: web app + PostgreSQL. Every push to the main branch redeploys automatically.
services:
  - type: web
    name: prismark-ops
    runtime: python
    plan: free            # change to starter for always on + a disk for documents
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prismark-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/uploads   # free plan: uploads are lost on each redeploy
      - key: SEED_DEMO
        sync: false           # "true" fills an empty database with demo data
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

databases:
  - name: prismark-db
    plan: free
    databaseName: prismark
    user: prismark
