services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]          # not published to the internet

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    volumes:
      - uploads:/data/uploads
    networks: [internal]          # only Caddy can reach it

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    networks: [internal]

volumes:
  pgdata:
  uploads:
  caddy_data:

networks:
  internal:
